# ============================================================
# PLACEMENT PREPARATION PORTAL - APPLICATION PROPERTIES
# ============================================================

# Server
server.port=8080
server.servlet.context-path=/

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/placement_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=PlacementPortalSecretKey2024PlacementPortalSecretKey2024PlacementPortal
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500

# Logging
logging.level.com.placement=DEBUG
logging.level.org.springframework.security=WARN