<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — PlacePrep</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
  /* =========================
     PROFILE PAGE
     ========================= */

  .profile-grid {
    display: grid;
    grid-template-columns: 270px minmax(0, 680px);
    gap: 1.75rem;
    align-items: start;
    max-width: 1000px;
    margin: 0 auto;
  }

  /* Profile summary card */
  .profile-card {
    text-align: center;
    padding: 1.75rem;
  }

  .avatar {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: 700;
    color: #fff;
    margin: 0 auto 1rem;
    box-shadow: 0 8px 25px rgba(99, 102, 241, 0.25);
  }

  .profile-card h3 {
    font-size: 1.05rem;
    margin-bottom: 0.35rem;
    word-break: break-word;
  }

  .profile-card .text-muted {
    word-break: break-word;
    line-height: 1.4;
  }

  .profile-card .usn-badge {
    margin-top: 0.75rem;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.84rem;
  }

  .info-row:last-child {
    border-bottom: none;
  }

  .info-row span:first-child {
    color: var(--text-muted);
  }

  .info-row span:last-child {
    font-weight: 600;
    text-align: right;
  }

  /* Profile settings card */
  .profile-settings-card {
    padding: 1.5rem 1.75rem;
  }

  .tab-buttons {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
    padding-bottom: 0.9rem;
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    padding: 0.55rem 1rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.84rem;
    font-weight: 600;
    border: 1px solid transparent;
    transition: var(--transition);
  }

  .tab-btn:hover {
    color: var(--text);
    background: var(--dark-3);
  }

  .tab-btn.active {
    background: var(--primary);
    color: #fff;
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }

  /* Form */
  .profile-settings-card .form-group {
    margin-bottom: 1rem;
  }

  .profile-settings-card .form-label {
    display: block;
    margin-bottom: 0.4rem;
    font-size: 0.82rem;
    font-weight: 600;
  }

  .profile-settings-card .form-control {
    height: 44px;
    font-size: 0.88rem;
    border-radius: 8px;
  }

  .profile-settings-card input:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  .profile-settings-card .form-error {
    margin-top: 0.35rem;
    font-size: 0.75rem;
  }

  .profile-settings-card .btn {
    margin-top: 0.25rem;
    padding: 0.65rem 1.1rem;
    font-size: 0.84rem;
  }

  /* Alerts */
  #infoAlert,
  #passAlert {
    margin-bottom: 0.9rem;
  }

  /* Page header */
  .main-content .page-header {
    margin-bottom: 1.5rem;
  }

  /* Mobile */
  @media (max-width: 900px) {
    .profile-grid {
      grid-template-columns: 1fr;
      max-width: 680px;
    }

    .profile-card {
      width: 100%;
    }
  }

  @media (max-width: 600px) {
    .profile-settings-card {
      padding: 1.25rem;
    }

    .tab-buttons {
      flex-direction: column;
    }

    .tab-btn {
      width: 100%;
      text-align: center;
    }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand"><div class="logo-icon">🎯</div>PlacePrep</div>
  <ul class="navbar-nav">
    <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
    <li><a href="practice.html"  class="nav-link">Practice</a></li>
    <li><a href="mocktest.html"  class="nav-link">Mock Test</a></li>
    <li><a href="bookmarks.html" class="nav-link">Bookmarks</a></li>
    <li><a href="analytics.html" class="nav-link">Analytics</a></li>
  </ul>
  <div class="navbar-end" id="navUser"></div>
</nav>

<div class="page-wrapper">
  <aside class="sidebar">
    <a class="sidebar-link" href="dashboard.html"><span class="icon">🏠</span>Dashboard</a>
    <a class="sidebar-link" href="practice.html"><span class="icon">📚</span>Practice</a>
    <a class="sidebar-link" href="mocktest.html"><span class="icon">⏱️</span>Mock Test</a>
    <a class="sidebar-link" href="bookmarks.html"><span class="icon">🔖</span>Bookmarks</a>
    <a class="sidebar-link" href="analytics.html"><span class="icon">📊</span>Analytics</a>
    <a class="sidebar-link active" href="profile.html"><span class="icon">👤</span>Profile</a>
    <div style="flex:1"></div>
    <a class="sidebar-link" href="#" onclick="Auth.logout()"><span class="icon">🚪</span>Logout</a>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">My Profile</h1>
      <p class="page-subtitle">Manage your account details and security</p>
    </div>

    <div class="profile-grid">
      <div class="card profile-card">
        <div class="avatar" id="avatarInitial">?</div>
        <h3 id="pName">—</h3>
        <p class="text-muted" style="font-size:0.85rem" id="pEmail">—</p>
        <div class="usn-badge"><span class="badge badge-primary" id="pUsn">—</span></div>
        <div class="mt-3" style="text-align:left">
          <div class="info-row"><span>Role</span><span id="pRole">Student</span></div>
          <div class="info-row"><span>Member Since</span><span id="pSince">—</span></div>
        </div>
      </div>

      <div class="card">
        <div class="tab-buttons">
          <button class="tab-btn active" onclick="switchTab('info')">Edit Profile</button>
          <button class="tab-btn" onclick="switchTab('password')">Change Password</button>
        </div>

        <div class="tab-content active" id="tab-info">
          <div id="infoAlert"></div>
          <form id="infoForm">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" id="editName" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" id="editEmail" class="form-control" required disabled>
              <div class="form-error" style="color:var(--text-muted)">Email cannot be changed</div>
            </div>
            <div class="form-group">
              <label class="form-label">USN</label>
              <input type="text" id="editUsn" class="form-control" disabled>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>

        <div class="tab-content" id="tab-password">
          <div id="passAlert"></div>
          <form id="passwordForm">
            <div class="form-group">
              <label class="form-label">Current Password</label>
              <input type="password" id="currentPassword" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">New Password</label>
              <input type="password" id="newPassword" class="form-control" required minlength="6">
            </div>
            <div class="form-group">
              <label class="form-label">Confirm New Password</label>
              <input type="password" id="confirmNewPassword" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script>
  if (!requireAuth()) throw '';
  initNavUser('navUser');

  const user = Auth.getUser();

  function loadProfile() {
    if (!user) return;
    const initial = (user.name || "S").charAt(0).toUpperCase();
    document.getElementById('avatarInitial').textContent = initial;
    document.getElementById('pName').textContent  = user.name  || '—';
    document.getElementById('pEmail').textContent = user.email || '—';
    document.getElementById('pUsn').textContent   = user.usn   || '—';
    document.getElementById('pRole').textContent  = user.role  || 'STUDENT';
    document.getElementById('pSince').textContent = 'Active member';

    document.getElementById('editName').value  = user.name  || '';
    document.getElementById('editEmail').value = user.email || '';
    document.getElementById('editUsn').value   = user.usn   || '';
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
  }

  // ---- Profile info update ----
  document.getElementById('infoForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertEl = document.getElementById('infoAlert');
    const newName = document.getElementById('editName').value.trim();
    const btn = e.target.querySelector('button[type="submit"]');

    if (!newName) {
      alertEl.innerHTML = '<div class="alert alert-danger">Name cannot be empty.</div>';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      await apiFetch('/users/profile', {
        method: 'PUT',
        body: JSON.stringify({ name: newName })
      });
      user.name = newName;
      localStorage.setItem('user', JSON.stringify(user));
      alertEl.innerHTML = '<div class="alert alert-success">✅ Profile updated successfully!</div>';
      loadProfile();
      initNavUser('navUser');
      showToast('Profile updated!', 'success');
    } catch (err) {
      // Fallback: update locally if backend endpoint not available
      user.name = newName;
      localStorage.setItem('user', JSON.stringify(user));
      alertEl.innerHTML = '<div class="alert alert-success">✅ Profile updated locally.</div>';
      loadProfile();
      showToast('Profile updated locally.', 'info');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Changes';
    }
  });

  // ---- Password change (calls real backend endpoint) ----
  document.getElementById('passwordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertEl = document.getElementById('passAlert');
    const currentPass = document.getElementById('currentPassword').value;
    const newPass     = document.getElementById('newPassword').value;
    const confPass    = document.getElementById('confirmNewPassword').value;
    const btn = e.target.querySelector('button[type="submit"]');

    alertEl.innerHTML = '';

    if (newPass !== confPass) {
      alertEl.innerHTML = '<div class="alert alert-danger">❌ New passwords do not match.</div>';
      return;
    }

    if (newPass.length < 6) {
      alertEl.innerHTML = '<div class="alert alert-danger">❌ Password must be at least 6 characters.</div>';
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Updating…';

    try {
      await apiFetch('/users/change-password', {
        method: 'PUT',
        body: JSON.stringify({
          currentPassword: currentPass,
          newPassword:     newPass,
          confirmPassword: confPass
        })
      });
      alertEl.innerHTML = '<div class="alert alert-success">✅ Password updated successfully! Please login again.</div>';
      showToast('Password changed successfully!', 'success');
      e.target.reset();
      // Auto-logout after password change for security
      setTimeout(() => Auth.logout(), 2500);
    } catch (err) {
      const msg = err.message || 'Failed to change password. Check your current password.';
      alertEl.innerHTML = `<div class="alert alert-danger">❌ ${msg}</div>`;
      showToast(msg, 'error');
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Update Password';
    }
  });

  loadProfile();
</script>
</body>
</html>
