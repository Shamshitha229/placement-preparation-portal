<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — PlacePrep</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .profile-grid { display: grid; grid-template-columns: 280px 1fr; gap: 1.5rem; }
    @media (max-width: 768px) { .profile-grid { grid-template-columns: 1fr; } }
    .profile-card { text-align: center; }
    .avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 700; color: #fff;
      margin: 0 auto 1rem;
    }
    .profile-card h3 { font-size: 1.1rem; margin-bottom: 0.25rem; }
    .profile-card .usn-badge { margin-top: 0.5rem; }
    .info-row { display: flex; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .info-row:last-child { border-bottom: none; }
    .info-row span:first-child { color: var(--text-muted); }
    .tab-buttons { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .tab-btn {
      padding: 0.5rem 1.2rem; border-radius: var(--radius-sm); cursor: pointer;
      background: var(--dark-3); color: var(--text-muted); font-size: 0.85rem; font-weight: 600;
      border: none; transition: var(--transition);
    }
    .tab-btn.active { background: var(--primary); color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand"><div class="logo-icon">🎯</div>PlacePrep</div>
  <ul class="navbar-nav">
    <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
    <li><a href="practice.html"  class="nav-link">Practice</a></li>
    <li><a href="mocktest.html"  class="nav-link">Mock Test</a></li>
    <li><a href="bookmarks.html" class="nav-link">Bookmarks</a></li>
    <li><a href="analytics.html" class="nav-link">Analytics</a></li>
  </ul>
  <div class="navbar-end" id="navUser"></div>
</nav>

<div class="page-wrapper">
  <aside class="sidebar">
    <a class="sidebar-link" href="dashboard.html"><span class="icon">🏠</span>Dashboard</a>
    <a class="sidebar-link" href="practice.html"><span class="icon">📚</span>Practice</a>
    <a class="sidebar-link" href="mocktest.html"><span class="icon">⏱️</span>Mock Test</a>
    <a class="sidebar-link" href="bookmarks.html"><span class="icon">🔖</span>Bookmarks</a>
    <a class="sidebar-link" href="analytics.html"><span class="icon">📊</span>Analytics</a>
    <a class="sidebar-link active" href="profile.html"><span class="icon">👤</span>Profile</a>
    <div style="flex:1"></div>
    <a class="sidebar-link" href="#" onclick="Auth.logout()"><span class="icon">🚪</span>Logout</a>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">My Profile</h1>
      <p class="page-subtitle">Manage your account details and security</p>
    </div>

    <div class="profile-grid">
      <div class="card profile-card">
        <div class="avatar" id="avatarInitial">?</div>
        <h3 id="pName">—</h3>
        <p class="text-muted" style="font-size:0.85rem" id="pEmail">—</p>
        <div class="usn-badge"><span class="badge badge-primary" id="pUsn">—</span></div>
        <div class="mt-3" style="text-align:left">
          <div class="info-row"><span>Role</span><span id="pRole">Student</span></div>
          <div class="info-row"><span>Member Since</span><span id="pSince">—</span></div>
        </div>
      </div>

      <div class="card">
        <div class="tab-buttons">
          <button class="tab-btn active" onclick="switchTab('info')">Edit Profile</button>
          <button class="tab-btn" onclick="switchTab('password')">Change Password</button>
        </div>

        <div class="tab-content active" id="tab-info">
          <div id="infoAlert"></div>
          <form id="infoForm">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" id="editName" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" id="editEmail" class="form-control" required disabled>
              <div class="form-error" style="color:var(--text-muted)">Email cannot be changed</div>
            </div>
            <div class="form-group">
              <label class="form-label">USN</label>
              <input type="text" id="editUsn" class="form-control" disabled>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>

        <div class="tab-content" id="tab-password">
          <div id="passAlert"></div>
          <form id="passwordForm">
            <div class="form-group">
              <label class="form-label">Current Password</label>
              <input type="password" id="currentPassword" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">New Password</label>
              <input type="password" id="newPassword" class="form-control" required minlength="6">
            </div>
            <div class="form-group">
              <label class="form-label">Confirm New Password</label>
              <input type="password" id="confirmNewPassword" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script>
  if (!requireAuth()) throw '';
  initNavUser('navUser');

  const user = Auth.getUser();

  function loadProfile() {
    document.getElementById('avatarInitial').textContent = user.name.charAt(0).toUpperCase();
    document.getElementById('pName').textContent  = user.name;
    document.getElementById('pEmail').textContent = user.email;
    document.getElementById('pUsn').textContent   = user.usn;
    document.getElementById('pRole').textContent  = user.role;
    document.getElementById('pSince').textContent = 'Active member';

    document.getElementById('editName').value  = user.name;
    document.getElementById('editEmail').value = user.email;
    document.getElementById('editUsn').value   = user.usn;
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
  }

  document.getElementById('infoForm').addEventListener('submit', (e) => {
    e.preventDefault();
    // Note: backend profile-update endpoint not implemented in this version;
    // name change is reflected locally for display purposes.
    const newName = document.getElementById('editName').value;
    user.name = newName;
    localStorage.setItem('user', JSON.stringify(user));
    document.getElementById('infoAlert').innerHTML = '<div class="alert alert-success">Profile updated locally. Contact admin to sync changes server-side.</div>';
    loadProfile();
    showToast('Profile updated', 'success');
  });

  document.getElementById('passwordForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const pass = document.getElementById('newPassword').value;
    const conf = document.getElementById('confirmNewPassword').value;
    const alertEl = document.getElementById('passAlert');
    if (pass !== conf) {
      alertEl.innerHTML = '<div class="alert alert-danger">New passwords do not match.</div>';
      return;
    }
    alertEl.innerHTML = '<div class="alert alert-info">Password change requires a dedicated backend endpoint (not included in this build). Please contact support.</div>';
  });

  loadProfile();
</script>
</body>
</html>
