<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Management — PlacePrep</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .admin-badge {
      background: linear-gradient(135deg, var(--danger), #f97316);
      color: #fff; font-size: 0.7rem; font-weight: 700;
      padding: 0.2rem 0.6rem; border-radius: 999px; margin-left: 0.5rem;
    }
    .toolbar { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: center; }
    .toolbar input, .toolbar select { min-width: 160px; }
    .toolbar .grow { flex: 1; min-width: 220px; }
    .q-text-cell { max-width: 360px; }
    .q-text-cell .truncated {
      display: block; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; max-width: 360px;
    }
    .action-icons { display: flex; gap: 0.5rem; }
    .icon-btn {
      background: none; border: none; cursor: pointer; font-size: 1rem;
      color: var(--text-muted); padding: 0.2rem; transition: var(--transition);
    }
    .icon-btn:hover { color: var(--primary-light); }
    .icon-btn.danger:hover { color: var(--danger); }
    .modal textarea { min-height: 80px; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <div class="logo-icon">🎯</div>
    PlacePrep <span class="admin-badge">ADMIN</span>
  </div>
  <ul class="navbar-nav">
    <li><a href="admin-dashboard.html" class="nav-link">Dashboard</a></li>
    <li><a href="question-management.html" class="nav-link active">Questions</a></li>
  </ul>
  <div class="navbar-end" id="navUser"></div>
</nav>

<div class="page-wrapper">
  <aside class="sidebar">
    <a class="sidebar-link" href="admin-dashboard.html"><span class="icon">🏠</span>Dashboard</a>
    <a class="sidebar-link active" href="question-management.html"><span class="icon">📝</span>Questions</a>
    <div style="flex:1"></div>
    <a class="sidebar-link" href="#" onclick="Auth.logout()"><span class="icon">🚪</span>Logout</a>
  </aside>

  <main class="main-content">
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:1rem">
      <div>
        <h1 class="page-title">Question Management</h1>
        <p class="page-subtitle">Add, edit, search, and delete practice questions</p>
      </div>
      <button class="btn btn-primary" onclick="openModal()">➕ Add Question</button>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" class="form-control grow" placeholder="Search questions by keyword…">
      <select id="filterCategory" class="form-control">
        <option value="">All Categories</option>
        <option value="APTITUDE">Aptitude</option>
        <option value="LOGICAL_REASONING">Logical Reasoning</option>
        <option value="VERBAL_ABILITY">Verbal Ability</option>
        <option value="TECHNICAL">Technical</option>
        <option value="CODING">Coding</option>
      </select>
      <button class="btn btn-secondary" onclick="loadQuestions()">Filter</button>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Question</th>
              <th>Category</th>
              <th>Company</th>
              <th>Difficulty</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="questionsTable">
            <tr><td colspan="5" class="text-center text-muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay hidden" id="questionModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Add Question</span>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modalAlert"></div>
    <form id="questionForm">
      <input type="hidden" id="qId">
      <div class="form-group">
        <label class="form-label">Question Text</label>
        <textarea id="qText" class="form-control" required></textarea>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Option A</label>
          <input type="text" id="qOptA" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Option B</label>
          <input type="text" id="qOptB" class="form-control" required>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Option C</label>
          <input type="text" id="qOptC" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Option D</label>
          <input type="text" id="qOptD" class="form-control" required>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Correct Option</label>
          <select id="qCorrect" class="form-control" required>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="qCategory" class="form-control" required>
            <option value="APTITUDE">Aptitude</option>
            <option value="LOGICAL_REASONING">Logical Reasoning</option>
            <option value="VERBAL_ABILITY">Verbal Ability</option>
            <option value="TECHNICAL">Technical</option>
            <option value="CODING">Coding</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Company</label>
          <select id="qCompany" class="form-control">
            <option value="">None</option>
            <option value="TCS">TCS</option>
            <option value="Infosys">Infosys</option>
            <option value="Wipro">Wipro</option>
            <option value="Accenture">Accenture</option>
            <option value="Cognizant">Cognizant</option>
            <option value="Capgemini">Capgemini</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Difficulty</label>
          <select id="qDifficulty" class="form-control">
            <option value="EASY">Easy</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HARD">Hard</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Explanation</label>
        <textarea id="qExplanation" class="form-control"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="saveBtn">Save Question</button>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  if (!requireAdmin()) throw '';
  initNavUser('navUser');

  let allQuestions = [];

  async function loadQuestions() {
    const tbody = document.getElementById('questionsTable');
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Loading…</td></tr>';

    const category = document.getElementById('filterCategory').value;
    const keyword = document.getElementById('searchInput').value.trim();

    try {
      let data;
      if (keyword) {
        data = await apiFetch('/questions/search?keyword=' + encodeURIComponent(keyword));
      } else {
        const qs = new URLSearchParams();
        if (category) qs.set('category', category);
        data = await apiFetch('/questions?' + qs.toString());
      }
      allQuestions = data;
      renderTable();
    } catch (e) {
      showToast('Failed to load questions: ' + e.message, 'error');
    }
  }

  function renderTable() {
    const tbody = document.getElementById('questionsTable');
    if (!allQuestions.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No questions found.</td></tr>';
      return;
    }
    tbody.innerHTML = allQuestions.map(q => `
      <tr>
        <td class="q-text-cell"><span class="truncated" title="${esc(q.questionText)}">${esc(q.questionText)}</span></td>
        <td><span class="badge ${CategoryColors[q.category] || 'badge-secondary'}">${q.category.replace(/_/g,' ')}</span></td>
        <td>${q.company ? esc(q.company) : '<span class="text-muted">—</span>'}</td>
        <td><span class="badge ${DifficultyColors[q.difficulty] || 'badge-secondary'}">${q.difficulty}</span></td>
        <td>
          <div class="action-icons">
            <button class="icon-btn" onclick="editQuestion(${q.id})" title="Edit">✏️</button>
            <button class="icon-btn danger" onclick="deleteQuestion(${q.id})" title="Delete">🗑️</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function openModal() {
    document.getElementById('modalTitle').textContent = 'Add Question';
    document.getElementById('questionForm').reset();
    document.getElementById('qId').value = '';
    document.getElementById('modalAlert').innerHTML = '';
    document.getElementById('questionModal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('questionModal').classList.add('hidden');
  }

  function editQuestion(id) {
    const q = allQuestions.find(x => x.id === id);
    if (!q) return;
    document.getElementById('modalTitle').textContent = 'Edit Question';
    document.getElementById('qId').value = q.id;
    document.getElementById('qText').value = q.questionText;
    document.getElementById('qOptA').value = q.optionA;
    document.getElementById('qOptB').value = q.optionB;
    document.getElementById('qOptC').value = q.optionC;
    document.getElementById('qOptD').value = q.optionD;
    document.getElementById('qCorrect').value = q.correctOption;
    document.getElementById('qCategory').value = q.category;
    document.getElementById('qCompany').value = q.company || '';
    document.getElementById('qDifficulty').value = q.difficulty;
    document.getElementById('qExplanation').value = q.explanation || '';
    document.getElementById('modalAlert').innerHTML = '';
    document.getElementById('questionModal').classList.remove('hidden');
  }

  async function deleteQuestion(id) {
    if (!confirm('Are you sure you want to delete this question? This cannot be undone.')) return;
    try {
      await apiFetch('/questions/' + id, { method: 'DELETE' });
      showToast('Question deleted', 'success');
      loadQuestions();
    } catch (e) {
      showToast('Failed to delete: ' + e.message, 'error');
    }
  }

  document.getElementById('questionForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('qId').value;
    const payload = {
      questionText: document.getElementById('qText').value,
      optionA: document.getElementById('qOptA').value,
      optionB: document.getElementById('qOptB').value,
      optionC: document.getElementById('qOptC').value,
      optionD: document.getElementById('qOptD').value,
      correctOption: document.getElementById('qCorrect').value,
      category: document.getElementById('qCategory').value,
      company: document.getElementById('qCompany').value || null,
      difficulty: document.getElementById('qDifficulty').value,
      explanation: document.getElementById('qExplanation').value
    };

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      if (id) {
        await apiFetch('/questions/' + id, { method: 'PUT', body: JSON.stringify(payload) });
        showToast('Question updated', 'success');
      } else {
        await apiFetch('/questions', { method: 'POST', body: JSON.stringify(payload) });
        showToast('Question added', 'success');
      }
      closeModal();
      loadQuestions();
    } catch (ex) {
      document.getElementById('modalAlert').innerHTML = `<div class="alert alert-danger">${ex.message}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Question';
    }
  });

  document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') loadQuestions();
  });

  loadQuestions();
</script>
</body>
</html>
