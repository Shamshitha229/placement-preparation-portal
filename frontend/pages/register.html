<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your PlacePrep account and start your campus placement preparation journey.">
    <title>Register — PlacePrep</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">

<div class="auth-container">
    <div class="auth-card">

        <div style="text-align:center; margin-bottom:1.5rem;">
            <div style="font-size:2rem; margin-bottom:0.5rem;">🎯</div>
            <h1 style="font-size:1.6rem; font-weight:800; margin-bottom:0.35rem;">Create Account</h1>
            <p class="auth-subtitle">Join thousands of students preparing for campus placements.</p>
        </div>

        <form id="registerForm" onsubmit="registerUser(event)">

            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    class="form-control"
                    placeholder="Enter your full name"
                    required
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter your college email"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="usn">USN / Roll Number</label>
                <input
                    type="text"
                    id="usn"
                    class="form-control"
                    placeholder="e.g. 1XX21CS001"
                    required
                    autocomplete="off"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    class="form-control"
                    placeholder="Re-enter your password"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:0.5rem;">
                🚀 Create Account
            </button>

        </form>

        <p style="margin-top:1.5rem; text-align:center;" class="text-muted">
            Already have an account?
            <a href="login.html" style="color:var(--primary-light); font-weight:600;">Login here</a>
        </p>

    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
